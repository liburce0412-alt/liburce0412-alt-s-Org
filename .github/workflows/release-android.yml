name: Release Android

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v6

      - name: Create ephemeral debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Detect signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are not configured; publishing a source-only release."
          fi

      - name: Verify release source
        shell: bash
        run: bash ./gradlew :apps:android:app:testDebugUnitTest :apps:android:bandbridge:testDebugUnitTest --stacktrace

      - name: Restore signing certificate
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/caesar-release.jks"

      - name: Build signed applications
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/caesar-release.jks
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}" \
          VERSION_CODE="$GITHUB_RUN_NUMBER" \
          bash ./gradlew \
            :apps:android:app:assembleRelease \
            :apps:android:bandbridge:lintRelease \
            :apps:android:bandbridge:assembleRelease \
            --stacktrace

      - name: Stage signed artifacts
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp "$HOME/.gradle/campusai-build/android-app/outputs/apk/release/app-release.apk" "dist/caesar-${GITHUB_REF_NAME}.apk"
          cp "$HOME/.gradle/campusai-build/bandbridge/outputs/apk/release/bandbridge-release.apk" "dist/caesar-bandbridge-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Publish signed release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Caesar∞ ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Publish source release
        if: steps.signing.outputs.available != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Caesar∞ ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
